# Databricks Asset Bundle — generated by Mapping Factory (Deploy-as-Pipeline).
# Deploy with:  databricks bundle deploy -t prod
bundle:
  name: finance_v4_pipeline

variables:
  catalog:
    default: pritam_demo_workspace_catalog
  target_schema:
    default: mapping_factory_pipeline

resources:
  pipelines:
    finance_v4_pipeline:
      name: finance_v4_pipeline
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.target_schema}
      continuous: false
      channel: CURRENT
      configuration:
        mf.catalog: ${var.catalog}
        mf.schema: ${var.target_schema}
        mf.config_catalog: ${var.catalog}
        mf.config_schema: ${var.target_schema}
        mf.config_key: "finance_v4_pipeline"
      libraries:
        - file:
            path: src/mapping_pipeline.py

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
